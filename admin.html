<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | ビジネス英語クイズ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c14;--surface:#12151f;--surface2:#1a1e2e;--surface3:#22273a;
  --accent:#6366f1;--accent2:#8b5cf6;--green:#22c55e;--red:#ef4444;
  --yellow:#f59e0b;--blue:#3b82f6;--cyan:#06b6d4;
  --text:#e2e8f0;--muted:#64748b;--border:#1e2336;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px}
.login-title{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--accent);text-align:center}
.login-sub{font-size:11px;color:var(--muted);margin-bottom:24px;text-align:center}
.login-label{font-size:11px;color:var(--muted);margin-bottom:4px;display:block}
.login-input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;margin-bottom:12px;outline:none}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none;text-align:center}
.login-divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.login-hint{font-size:10px;color:var(--muted);background:rgba(99,102,241,0.1);border-radius:8px;padding:8px 12px;margin-bottom:16px;line-height:1.6}

/* MAIN APP */
#app{display:none;height:100vh;overflow:hidden;flex-direction:column}
#app.show{display:flex}

/* Top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-logo{font-size:13px;font-weight:700;color:var(--accent)}
.status-badge{font-size:10px;padding:2px 8px;border-radius:10px;display:flex;align-items:center;gap:4px}
.status-badge.ok{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3)}
.status-badge.off{background:rgba(100,116,139,0.15);color:var(--muted);border:1px solid var(--border)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-btn{padding:4px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit}
.tb-btn:hover{border-color:var(--accent);color:var(--text)}

/* Layout */
.layout{display:flex;flex:1;overflow:hidden}

/* LEFT: Office */
.left-panel{width:460px;min-width:460px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-hdr{padding:6px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.panel-hdr span{margin-left:auto;font-size:10px}

.canvas-wrap{display:flex;justify-content:center;align-items:center;padding:8px;background:var(--bg);flex-shrink:0}
canvas{image-rendering:pixelated;display:block;border:1px solid var(--border);border-radius:4px}

.controls{display:flex;gap:6px;padding:6px 10px;background:var(--surface2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.ctrl-btn{padding:3px 10px;font-size:10px;border:none;border-radius:5px;cursor:pointer;font-family:inherit;font-weight:700}
#btn-start{background:#238636;color:#fff}
#btn-stop{background:#da3633;color:#fff}
#btn-reset{background:#444;color:#ccc}
#sim-status{font-size:10px;color:var(--muted);margin-left:auto}

.task-list{flex:1;overflow-y:auto;padding:6px}
.task-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;margin-bottom:3px;font-size:10px;border:1px solid transparent}
.task-item.running{background:rgba(99,102,241,0.15);border-color:var(--accent)}
.task-item.done{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.25)}
.task-item.pending{color:var(--muted)}
.task-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.task-dot.pending{background:var(--muted)}
.task-dot.running{background:var(--accent);animation:pulse 1s infinite}
.task-dot.done{background:var(--green)}
.task-name{flex:1}
.task-emp{font-size:9px;color:var(--muted)}

.log-area{height:90px;overflow-y:auto;padding:5px 8px;background:var(--bg);border-top:1px solid var(--border);font-size:10px;color:var(--muted)}
.log-line{padding:1px 0}
.log-line .ts{color:var(--muted)}
.log-line .msg{color:var(--text);margin-left:5px}
.log-line.success .msg{color:var(--green)}
.log-line.warn .msg{color:var(--yellow)}
.log-line.error .msg{color:var(--red)}

/* RIGHT: Chat */
.right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Chat messages */
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-msg{display:flex;gap:10px;max-width:90%}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse}
.chat-avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--surface2)}
.chat-bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.6}
.chat-msg.user .chat-bubble{background:rgba(99,102,241,0.2);border-color:rgba(99,102,241,0.4)}
.chat-msg.system .chat-bubble{background:rgba(6,182,212,0.08);border-color:rgba(6,182,212,0.2);font-size:11px;color:var(--cyan)}
.chat-name{font-size:10px;color:var(--muted);margin-bottom:4px}
.chat-time{font-size:9px;color:var(--muted);margin-top:4px}

/* Questions preview in chat */
.q-preview{background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:11px;max-height:160px;overflow-y:auto;border:1px solid var(--border)}
.q-item{padding:3px 0;border-bottom:1px solid var(--border)}
.q-item:last-child{border-bottom:none}
.q-lv{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;margin-right:5px}

/* Deploy button */
.deploy-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:linear-gradient(135deg,var(--green),#16a34a);border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.deploy-btn:disabled{background:var(--muted);cursor:default}
.deploy-btn.deploying{background:var(--blue);animation:pulse 1s infinite}

/* Quick actions */
.quick-actions{padding:8px 12px;border-top:1px solid var(--border);background:var(--surface2);display:flex;gap:6px;flex-wrap:wrap}
.qa-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:10px;cursor:pointer;font-family:inherit}
.qa-btn:hover{border-color:var(--accent);color:var(--text)}
.qa-label{font-size:10px;color:var(--muted);align-self:center;margin-right:4px}

/* Input area */
.input-area{padding:10px 12px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:8px}
.chat-input{flex:1;padding:9px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:none;max-height:80px;min-height:38px}
.chat-input:focus{border-color:var(--accent)}
.send-btn{padding:9px 18px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.send-btn:disabled{background:var(--muted);cursor:default}

/* Thinking indicator */
.thinking{display:flex;gap:4px;align-items:center;padding:8px 4px}
.thinking-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
.thinking-dot:nth-child(2){animation-delay:0.2s}
.thinking-dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0.8);opacity:0.5}40%{transform:scale(1.2);opacity:1}}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

@media(max-width:800px){.left-panel{display:none}.chat-msg{max-width:95%}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div style="font-size:32px;margin-bottom:8px">🤖</div>
  <div class="login-box">
    <div class="login-title">AIオフィス 管理画面</div>
    <div class="login-sub">ビジネス英語クイズ v2.0 — Level 3</div>
    <div class="login-hint">
      🔐 入力した情報はメモリにのみ保存され、ページを閉じると消えます<br>
      💡 APIキーとTokenはコードに保存されません
    </div>
    <label class="login-label">管理者パスワード</label>
    <input class="login-input" type="password" id="pw-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')doLogin()">
    <hr class="login-divider">
    <label class="login-label">Gemini APIキー（無料枠）</label>
    <input class="login-input" type="password" id="gemini-input" placeholder="AIza... で始まるキー" onkeydown="if(event.key==='Enter')doLogin()">
    <label class="login-label">GitHub Personal Access Token</label>
    <input class="login-input" type="password" id="github-input" placeholder="ghp_... で始まるToken" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">🚀 ログイン</button>
    <div class="login-err" id="login-err">パスワードが違います</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">🏢 AIオフィス管理画面</div>
    <div class="status-badge ok" id="gemini-status"><div class="dot"></div>Gemini接続済</div>
    <div class="status-badge ok" id="github-status"><div class="dot"></div>GitHub接続済</div>
    <div class="topbar-right">
      <div id="clock" style="font-size:10px;color:var(--muted)"></div>
      <button class="tb-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="layout">
    <!-- LEFT: Office sim -->
    <div class="left-panel">
      <div class="panel-hdr">🏢 AIオフィス <span id="phase-badge">待機中</span></div>
      <div class="canvas-wrap">
        <canvas id="office-canvas" width="448" height="256"></canvas>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btn-start" onclick="startAutoSim()">▶ 自動生成</button>
        <button class="ctrl-btn" id="btn-stop" onclick="stopSim()">⏸ 停止</button>
        <button class="ctrl-btn" id="btn-reset" onclick="resetSim()">↺ リセット</button>
        <span id="sim-status">待機中</span>
      </div>
      <div class="panel-hdr">📋 タスク</div>
      <div class="task-list" id="task-list"></div>
      <div class="panel-hdr">📟 ログ</div>
      <div class="log-area" id="log-area"></div>
    </div>

    <!-- RIGHT: Chat -->
    <div class="right-panel">
      <div class="chat-area" id="chat-area"></div>

      <div class="quick-actions">
        <span class="qa-label">生成:</span>
        <button class="qa-btn" onclick="quickAction(500,5)">500点×5問</button>
        <button class="qa-btn" onclick="quickAction(650,5)">650点×5問</button>
        <button class="qa-btn" onclick="quickAction(730,3)">730点×3問</button>
        <button class="qa-btn" onclick="quickAction(860,3)">860点×3問</button>
        <button class="qa-btn" onclick="quickAction('mix',10)">ミックス10問</button>
      </div>
      <div class="quick-actions" style="border-top:none;padding-top:2px">
        <span class="qa-label">調査:</span>
        <button class="qa-btn" style="border-color:#06b6d4;color:#06b6d4" onclick="quickSearch('最近のTOEIC出題傾向と頻出テーマを調べて、このサイトで次に作るべき問題を提案して')">📰 TOEIC最新傾向</button>
        <button class="qa-btn" style="border-color:#f59e0b;color:#f59e0b" onclick="quickSearch('このTOEICビジネス英語クイズサイトの収益化方法を具体的に教えて')">💰 収益化相談</button>
        <button class="qa-btn" style="border-color:#22c55e;color:#22c55e" onclick="quickSearch('ビジネス英語学習の最新トレンドとユーザーが求めているコンテンツを調べて')">🌐 市場調査</button>
      </div>

      <div class="input-area">
        <textarea class="chat-input" id="chat-input" placeholder="社員に指示を送る... (例: 500点の問題を3問生成して / UIを改善して)" onkeydown="handleKey(event)" rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== CREDENTIALS (memory only) =====
const PASS = 'admin2026';
const REPO = 'hinatry/eigo-quiz';
const BRANCH = 'main';
let GEMINI_KEY = '';
let GITHUB_TOKEN = '';

// ===== AUTH =====
function doLogin(){
  const pw = document.getElementById('pw-input').value;
  const gk = document.getElementById('gemini-input').value.trim();
  const gt = document.getElementById('github-input').value.trim();
  if(pw !== PASS){
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-err').textContent='パスワードが違います';
    document.getElementById('pw-input').value='';
    return;
  }
  if(!gk || gk.length < 10){
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-err').textContent='Gemini APIキーを入力してください';
    return;
  }
  if(!gt || !gt.startsWith('ghp_')){
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-err').textContent='GitHub Tokenを確認してください（ghp_で始まる）';
    return;
  }
  GEMINI_KEY = gk;
  GITHUB_TOKEN = gt;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('show');
  initApp();
}

function doLogout(){
  GEMINI_KEY = ''; GITHUB_TOKEN = '';
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
  document.getElementById('gemini-input').value='';
  document.getElementById('github-input').value='';
  document.getElementById('login-err').style.display='none';
}

// ===== CLOCK =====
function updateClock(){
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('ja-JP');
}
setInterval(updateClock,1000); updateClock();

// ===== CANVAS / PIXEL ART =====
const S=2, VW=224, VH=128;
const canvas=document.getElementById('office-canvas');
canvas.width=VW*S; canvas.height=VH*S;
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

const CHARS=[
  {id:'pm',  x:20, y:20, color:'#5b8af5',label:'PM',   state:'idle'},
  {id:'eng', x:70, y:20, color:'#f55b5b',label:'Dev',  state:'idle'},
  {id:'res', x:120,y:20, color:'#f5c85b',label:'研究', state:'idle'},
  {id:'des', x:170,y:20, color:'#c85bf5',label:'UI',   state:'idle'},
  {id:'qa',  x:20, y:75, color:'#5bf5c8',label:'QA',   state:'idle'},
  {id:'wrt', x:70, y:75, color:'#f5a55b',label:'Writer',state:'idle'},
];

let frame=0, animTimer=null, simRunning=false;

function drawPixelChar(c,t){
  const x=c.x*S, y=c.y*S, s=S;
  ctx.fillStyle=c.color;
  ctx.fillRect(x+3*s,y+4*s,5*s,6*s);
  ctx.fillStyle='#ffd5a0';
  ctx.fillRect(x+3*s,y+s,5*s,4*s);
  ctx.fillStyle='#222';
  if(c.state==='working'){
    ctx.fillRect(x+4*s,y+2*s,s,2*s);
    ctx.fillRect(x+6*s,y+2*s,s,2*s);
  } else {
    ctx.fillRect(x+4*s,y+2*s,s,s);
    ctx.fillRect(x+6*s,y+2*s,s,s);
    if(c.state==='idle'){
      ctx.fillStyle='#aaa';
      const blink=Math.floor(t/30)%2;
      if(blink) ctx.fillRect(x+8*s,y,2*s,s);
    }
  }
  ctx.fillStyle=c.color;
  if(c.state==='working'&&Math.floor(t/10)%2===0){
    ctx.fillRect(x+s,y+4*s,2*s,5*s);
    ctx.fillRect(x+8*s,y+4*s,2*s,5*s);
  } else {
    ctx.fillRect(x+s,y+5*s,2*s,4*s);
    ctx.fillRect(x+8*s,y+5*s,2*s,4*s);
  }
  ctx.fillStyle='#334';
  ctx.fillRect(x+3*s,y+10*s,2*s,3*s);
  ctx.fillRect(x+6*s,y+10*s,2*s,3*s);
  ctx.fillStyle='#4a3728';
  ctx.fillRect(x,y+14*s,11*s,2*s);
  ctx.fillStyle=c.state==='working'?'#2a4a7a':'#1a2a3a';
  ctx.fillRect(x+s,y+11*s,9*s,3*s);
  if(c.state==='working'){
    const blink2=Math.floor(t/8)%3;
    ctx.fillStyle='#5bf5c8';
    ctx.fillRect(x+2*s+blink2*s,y+12*s,2*s,s);
  }
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(x,y+16*s,11*s,6*s);
  ctx.fillStyle='#fff';
  ctx.font=`${s*4}px monospace`;
  ctx.textAlign='center';
  ctx.fillText(c.label,x+5.5*s,y+20*s);
  if(c.state==='done'){
    ctx.fillStyle='#22c55e';
    ctx.fillRect(x+7*s,y,4*s,4*s);
    ctx.fillStyle='#fff';
    ctx.fillText('✓',x+9*s,y+3*s);
  }
}

function drawOffice(t){
  ctx.fillStyle='#1a1208';
  ctx.fillRect(0,0,VW*S,VH*S);
  ctx.fillStyle='#2a2010';
  ctx.fillRect(0,VH*S-20*S,VW*S,20*S);
  ctx.fillStyle='#0f0f18';
  ctx.fillRect(0,0,VW*S,30*S);
  for(let i=0;i<3;i++){
    ctx.fillStyle='#1a2a3a';
    ctx.fillRect((30+i*60)*S,4*S,30*S,18*S);
    ctx.fillStyle='rgba(150,200,255,0.1)';
    ctx.fillRect((31+i*60)*S,5*S,28*S,16*S);
    ctx.strokeStyle='#2a4a6a';
    ctx.strokeRect((30+i*60)*S,4*S,30*S,18*S);
  }
  CHARS.forEach(c=>drawPixelChar(c,t));
}

function animLoop(){
  frame++;
  drawOffice(frame);
  if(simRunning) animTimer=requestAnimationFrame(animLoop);
}
drawOffice(0);

// ===== TASKS (auto sim) =====
const TASKS=[
  {id:'t1',name:'プロジェクト計画策定',emp:'pm', dur:3000, effect:'plan'},
  {id:'t2',name:'英語問題トレンド分析',emp:'res',dur:4000, effect:'analyze'},
  {id:'t3',name:'500点問題生成(AI)',   emp:'wrt',dur:6000, effect:'gen500'},
  {id:'t4',name:'650点問題生成(AI)',   emp:'wrt',dur:6000, effect:'gen650'},
  {id:'t5',name:'730点問題生成(AI)',   emp:'eng',dur:6000, effect:'gen730'},
  {id:'t6',name:'860点問題生成(AI)',   emp:'eng',dur:6000, effect:'gen860'},
  {id:'t7',name:'品質レビュー',        emp:'qa', dur:4000, effect:'review'},
  {id:'t8',name:'GitHubへ自動デプロイ',emp:'pm', dur:5000, effect:'deploy'},
];

let taskStates={}, currentTaskIdx=-1, simTimer=null;
let autoGenQuestions=[];

function initTasks(){
  taskStates={};
  TASKS.forEach(t=>{taskStates[t.id]='pending';});
  renderTasks();
}

function renderTasks(){
  const el=document.getElementById('task-list');
  el.innerHTML='';
  TASKS.forEach(t=>{
    const st=taskStates[t.id]||'pending';
    const div=document.createElement('div');
    div.className=`task-item ${st}`;
    div.innerHTML=`<div class="task-dot ${st}"></div><div class="task-name">${t.name}</div><div class="task-emp">${getEmpLabel(t.emp)}</div>`;
    el.appendChild(div);
  });
}

function getEmpLabel(id){
  return {pm:'👔PM',eng:'💻Dev',res:'📚研究',des:'🎨UI',qa:'🔍QA',wrt:'✍Writer'}[id]||id;
}

function addLog(msg,type=''){
  const el=document.getElementById('log-area');
  const t=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const div=document.createElement('div');
  div.className=`log-line ${type}`;
  div.innerHTML=`<span class="ts">[${t}]</span><span class="msg">${msg}</span>`;
  el.appendChild(div);

async function runNextAutoTask(){
  currentTaskIdx++;
  if(currentTaskIdx>=TASKS.length){
    onAllAutoTasksDone();
    return;
  }
  const task=TASKS[currentTaskIdx];
  taskStates[task.id]='running';
  renderTasks();
  const char=CHARS.find(c=>c.id===task.emp)||CHARS[0];
  char.state='working';
  document.getElementById('phase-badge').textContent=task.name;
  addLog(`${getEmpLabel(task.emp)}: ${task.name}開始`);

  // Execute effect
  try {
    await applyAutoEffect(task.effect, task.dur);
  } catch(e){
    addLog(`エラー: ${e.message}`,'error');
  }

  if(!simRunning) return;
  taskStates[task.id]='done';
  char.state='done';
  renderTasks();
  addLog(`✅ ${task.name} 完了`,'success');

  simTimer=setTimeout(()=>{ if(simRunning) runNextAutoTask(); }, 500);
}

// ===== GEMINI API =====
async function callGemini(prompt, useSearch=false){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`;
  const body = {
    contents:[{parts:[{text:prompt}]}],
    generationConfig:{temperature:0.7,maxOutputTokens:4096}
  };
  if(useSearch){
    body.tools=[{google_search:{}}];
  }
  const res = await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!res.ok){
    const err=await res.json();
    throw new Error(err.error?.message||`HTTP ${res.status}`);
  }
  const data=await res.json();
  // Extract text (grounding response may have different structure)
  const parts = data.candidates[0].content.parts;
  return parts.map(p=>p.text||'').join('');
}

async function generateWithGemini(level, count){
  const prompt=`あなたはTOEICビジネス英語の問題作成の専門家です。
レベル${level}点の問題を${count}問生成してください。

必ず以下のJSON配列形式のみで返答してください。説明文・コードブロック・バッククォートは不要です。

[
  {
    "level": ${level},
    "cat": "grammar",
    "q": "問題文（空欄は___で表現、自然なビジネス英語）",
    "opts": ["正解の選択肢", "不正解B", "不正解C", "不正解D"],
    "ans": 0,
    "exp": "解説（日本語で簡潔に、文法ポイントを説明）"
  }
]

注意事項：
- 必ずJSON配列のみ返す
- 選択肢は4つ
- ans は正解のインデックス（0-3）
- ビジネス英語に特化（会議・メール・報告書・交渉等）
- ${level}点レベルに適した難易度`;

  try {
    const text = await callGemini(prompt);
    // Parse JSON - handle possible markdown code blocks
    let clean = text.trim();
    clean = clean.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    // Find JSON array
    const start = clean.indexOf('[');
    const end = clean.lastIndexOf(']');
    if(start===-1||end===-1) throw new Error('JSONが見つかりません');
    const jsonStr = clean.slice(start,end+1);
    const parsed = JSON.parse(jsonStr);
    return parsed.map(q=>({...q,level:Number(q.level)||level}));
  } catch(e){
    addLog(`Gemini解析エラー: ${e.message}. テンプレートを使用します。`,'warn');
    return getFallbackQuestions(level, count);
  }
}

// Fallback templates if Gemini fails
function getFallbackQuestions(level, count){
  const templates={
    500:[
      {level:500,cat:'grammar',q:'The meeting has been ___ to next Monday.',opts:['postponed','postpone','postponing','postponement'],ans:0,exp:'has been + 過去分詞（受動態完了形）'},
      {level:500,cat:'grammar',q:'Please ___ me know when you are available.',opts:['let','make','have','get'],ans:0,exp:'let me know = 知らせる'},
      {level:500,cat:'grammar',q:'The report is ___ by Friday.',opts:['due','do','done','doing'],ans:0,exp:'due = 期限'},
    ],
    650:[
      {level:650,cat:'grammar',q:'The board is considering ___ its global operations.',opts:['expanding','expand','expanded','expansion'],ans:0,exp:'consider + 動名詞'},
      {level:650,cat:'grammar',q:'___ the budget constraints, we approved the project.',opts:['Despite','Although','However','Even'],ans:0,exp:'Despite + 名詞'},
    ],
    730:[
      {level:730,cat:'grammar',q:'The consultant recommended that the team ___ its approach.',opts:['revisit','revisits','revisited','revisiting'],ans:0,exp:'recommend that + 仮定法現在'},
    ],
    860:[
      {level:860,cat:'grammar',q:'The strategy was predicated ___ sustainable growth.',opts:['on','upon','in','at'],ans:0,exp:'predicated on = 〜を前提とする'},
    ]
  };
  const pool=templates[level]||templates[500];
  return pool.slice(0,Math.min(count,pool.length));
}

// ===== GITHUB API =====
async function getFileFromGitHub(path){
  const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`,{
    headers:{
      'Authorization':`token ${GITHUB_TOKEN}`,
      'Accept':'application/vnd.github.v3+json'
    }
  });
  if(!res.ok) throw new Error(`GitHub GET error: ${res.status}`);
  return await res.json();
}

async function updateFileOnGitHub(path, content, message){
  // Get current SHA
  let sha = '';
  try {
    const current = await getFileFromGitHub(path);
    sha = current.sha;
  } catch(e){
    // File might not exist yet
  }

  const encoded = btoa(unescape(encodeURIComponent(content)));
  const body={message, content:encoded, branch:BRANCH};
  if(sha) body.sha=sha;

  const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{
    method:'PUT',
    headers:{
      'Authorization':`token ${GITHUB_TOKEN}`,
      'Accept':'application/vnd.github.v3+json',
      'Content-Type':'application/json'
    },
    body:JSON.stringify(body)
  });
  if(!res.ok){
    const err=await res.json();
    throw new Error(err.message||`HTTP ${res.status}`);
  }
  return await res.json();
}

async function deployToGitHub(newQuestions){
  try {
    // Get existing questions
    let existing=[];
    let existingData={};
    try {
      const fileData=await getFileFromGitHub('questions.json');
      const decoded=decodeURIComponent(escape(atob(fileData.content.replace(/\n/g,''))));
      existingData=JSON.parse(decoded);
      existing=existingData.questions||[];
    } catch(e){
      addLog('既存ファイル取得失敗。新規作成します。','warn');
    }

    const maxId=existing.length>0?Math.max(...existing.map(q=>q.id||0)):0;
    const numbered=newQuestions.map((q,i)=>({...q,id:maxId+i+1}));
    const merged=[...existing,...numbered];
    const out={
      version:'2.0',
      generated:new Date().toISOString().slice(0,10),
      total:merged.length,
      questions:merged
    };
    const jsonStr=JSON.stringify(out,null,2);
    const commitMsg=`🤖 AI生成: ${numbered.length}問追加 (合計${merged.length}問) [auto]`;
    await updateFileOnGitHub('questions.json', jsonStr, commitMsg);
    return {ok:true, url:`https://hinatry.github.io/eigo-quiz/`};
  } catch(e){
    return {ok:false, error:e.message};
  }
}

async function processInstruction(text){
  const lower=text.toLowerCase();

  // Detect level
  let level=null;
  if(/500/.test(text)) level=500;
  else if(/650/.test(text)) level=650;
  else if(/730/.test(text)) level=730;
  else if(/860/.test(text)) level=860;

  // Detect count
  const numMatch=text.match(/(\d+)問/);
  const count=numMatch?parseInt(numMatch[1]):5;

  // Question generation
  if(/問題|生成|generate|quiz|英語問題/.test(lower)){
    const targetLevel=level||500;
    const emp=CHARS.find(c=>c.id==='wrt');
    if(emp){ emp.state='working'; if(!simRunning){simRunning=true;animLoop();} }
    addChatMessage('wrt',`了解！Gemini AIで${targetLevel}点の問題を${count}問生成します...`,'thinking');
    addLog(`問題生成: ${targetLevel}点 ${count}問`);

    const qs=await generateWithGemini(targetLevel,count);
    if(emp){ emp.state='done'; }

    addChatMessage('wrt',`✅ ${qs.length}問生成しました！GitHubにデプロイしますか？`,null,qs);

    // Show deploy button
    addDeployButton(qs);
    return;
  }

  // Mix generation
  if(/ミックス|mix|全レベル|all/.test(lower)){
    addChatMessage('pm','全レベルの問題を生成します！');
    const all=[];
    for(const lv of [500,650,730,860]){
      addChatMessage('wrt',`${lv}点問題を生成中...`,'thinking');

    addDeployButton(all);

  }

  // GitHub deploy
  if(/デプロイ|deploy|github|コミット|push/.test(lower)){
    if(pendingQuestions.length===0){
      addChatSystem('デプロイする問題がありません。まず問題を生成してください。');

  const isBusiness = /稼|収益|マネタイズ|ビジネス|お金|収入|販売|売上|課金|有料|広告/.test(lower);

  if(isWebSearch){
    const empChar=CHARS.find(c=>c.id==='res');
    if(empChar){ empChar.state='working'; if(!simRunning){simRunning=true;animLoop();} }
    addChatMessage('res','🔍 Webを検索しながら調査中...','thinking');
    addLog('Web検索グラウンディング使用中');

以下の質問に対して、最新のWeb情報を参照しながら日本語で詳しく回答してください。

質問: ${text}

回答には以下を含めてください：
- 具体的な最新データや傾向
- このビジネス英語クイズサイトへの活用提案
- 次に生成すべき問題カテゴリの提案`;

    const reply = await callGemini(prompt, true); // useSearch=true
    if(empChar) empChar.state='done';
    addChatMessage('res', reply);
    addLog('Web検索完了','success');
    return;
  }

async function doDeployPending(btn){
  if(pendingQuestions.length===0) return;
  if(!confirm(`${pendingQuestions.length}問をGitHubにデプロイしますか？\nquestions.jsonが自動更新されます。`)) return;
  const qs=[...pendingQuestions];
  if(btn){ btn.disabled=true; btn.classList.add('deploying'); btn.textContent='⏳ デプロイ中...'; }
  addLog(`GitHub デプロイ中: ${qs.length}問`);

  const emp=CHARS.find(c=>c.id==='pm');
  if(emp){ emp.state='working'; }

  const result=await deployToGitHub(qs);

  if(emp){ emp.state='done'; }
  pendingQuestions=[];

  if(result.ok){
    addChatMessage('pm',`🎉 デプロイ成功！\n${qs.length}問をquestions.jsonに追加しました。\nGitHub Pagesに反映まで数分かかります。\n🌐 ${result.url}`);
    addLog('✅ デプロイ成功！','success');
    if(btn){ btn.textContent='✅ 完了！'; }
  } else {
    addChatMessage('pm',`⚠️ デプロイ失敗: ${result.error}`,'error');
    addLog(`デプロイ失敗: ${result.error}`,'error');
    if(btn){ btn.textContent='❌ 失敗'; btn.disabled=false; }
  }

  if(!simRunning && emp){
    setTimeout(()=>{ if(emp.state==='done'){emp.state='idle'; drawOffice(frame);} },3000);
  }
}

// ===== QUICK SEARCH =====
async function quickSearch(query){
  document.getElementById('chat-input').value = query;
  await sendMessage();
}

// ===== QUICK ACTIONS =====
async function quickAction(level, count){
  const label = level==='mix' ? `全レベルミックス ${count}問` : `${level}点 ${count}問`;
  if(!confirm(`${label}を生成しますか？\n（生成後、内容を確認してからデプロイできます）`)) return;
  if(level==='mix'){
    document.getElementById('chat-input').value='ミックスで10問生成して';
  } else {
    document.getElementById('chat-input').value=`${level}点の問題を${count}問生成して`;
  }
  await sendMessage();
}

// ===== UTILS =====
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ===== INIT =====
function initApp(){
  initTasks();
  addChatSystem('🚀 AIオフィス管理画面 v2.0 起動完了。Gemini API + GitHub接続済み。\n\n💡 使い方:\n• クイックボタンで問題を生成→自動デプロイ\n• テキストで自由に指示（例:「500点の問題を3問生成して」）\n• 「自動生成」ボタンで全レベル一括生成＆デプロイ');
  addLog('管理画面起動完了','success');
}
</script>
